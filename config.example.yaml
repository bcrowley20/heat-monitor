# Copy to config.yaml and edit. Secrets go in .env, not here.

data_dir: data            # database, Nest token and log file
host: 0.0.0.0             # listen on the home network
port: 8080
timezone: America/Los_Angeles

station_id: KWACLEEL38
# Station location, used for Open-Meteo gap filling.
latitude: 47.180
longitude: -120.744

intervals:
  nest_s: 120             # minimum 60
  weather_s: 600
  tank_s: 7200

# Zones are matched to thermostats by the Nest room name or the thermostat's custom
# name. If a thermostat doesn't match, the log names it; then set nest_device_id here.
# loops, area_sqft (square feet) and exposure (N/S/E/W) are optional.
zones:
  - name: Hallway
  - name: Great Room
  - name: Master Bedroom
  - name: Guest Bedroom
