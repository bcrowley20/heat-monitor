; Boiler pump sensor firmware for the original M5Stack Cardputer (StampS3).
; Build and flash from this folder with: uvx platformio run -e cardputer -t upload
; After that first USB flash, update over Wi-Fi with:
;     PUMP_OTA_PASSWORD=... uvx platformio run -e cardputer-ota -t upload
; Add --upload-port <IP address> if pump-sensor.local isn't found.

[platformio]
default_envs = cardputer

[env:cardputer]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
lib_deps = m5stack/M5Cardputer@^1.0.3
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

[env:cardputer-ota]
extends = env:cardputer
upload_protocol = espota
upload_port = pump-sensor.local
upload_flags = --auth=${sysenv.PUMP_OTA_PASSWORD}
