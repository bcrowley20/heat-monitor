; Boiler pump sensor firmware for the original M5Stack Cardputer (StampS3).
; Build and flash from this folder with: uvx platformio run -t upload

[env:cardputer]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
lib_deps = m5stack/M5Cardputer@^1.0.3
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
